name: TAPAS OS Desktop Installers

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: ""
          - platform: windows-latest
            args: ""
          - platform: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl wget file libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            libwebkit2gtk-4.1-dev libxdo-dev

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and publish desktop bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Address of your hosted TAPAS AI endpoint, e.g. https://your-project.vercel.app/api/tapas-ai
          # Add it in GitHub: Settings > Secrets and variables > Actions > New repository secret.
          TAPAS_AI_URL: ${{ secrets.TAPAS_AI_URL }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "TAPAS OS ${{ github.ref_name }}"
          releaseBody: "TAPAS OS desktop installers for macOS, Windows, and Linux."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
